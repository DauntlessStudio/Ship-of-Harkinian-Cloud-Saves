services:
  soh-cloud-save:
    image: denoland/deno:latest
    container_name: soh-cloud-save
    working_dir: /app
    volumes:
      - .:/app
      - ./saves:/app/saves
    env_file:
      - .env
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: sh -c "if [ -f .env ]; then echo 'Found .env'; else touch .env; fi && deno task serve"
